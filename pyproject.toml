[project]
name = "automated-e2e"
version = "0.1.0"
description = "Analyze a repository and generate/maintain Selenium E2E tests for its services"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "anthropic>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
automated-e2e = "automated_e2e.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["automated_e2e*"]
