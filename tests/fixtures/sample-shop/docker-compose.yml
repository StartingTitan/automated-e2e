version: "3.8"
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - ORDER_SERVICE_URL=http://order-service:8080
  order-service:
    build: ./order-service
    ports:
      - "8080:8080"
    environment:
      PAYMENT_SERVICE_URL: http://payment-service:9090
    depends_on:
      - payment-service
  payment-service:
    image: sample/payment-service:latest
    ports:
      - "9090:9090"
